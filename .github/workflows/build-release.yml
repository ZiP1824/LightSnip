name: Windows build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'assets/**'
      - 'requirements*.txt'
      - 'build.ps1'
      - 'VERSION'
      - '.github/workflows/build-release.yml'
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - name: Test
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest test_delayed_capture test_app test_startup test_ocr_layout test_scroll_stitcher test_file_names test_save_locations test_theme test_window_detection test_element_detection test_mosaic test_floating_placement -q
      - name: Build portable application
        shell: pwsh
        run: .\build.ps1
      - name: Verify portable application
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe verify_v27.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content VERSION -Raw).Trim()
          $test = Start-Process -WindowStyle Hidden -FilePath ".\releases\v$version\LightSnip\LightSnip.exe" -ArgumentList '--self-test','package-self-test.json' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Packaged self-test failed' }
          $report = Get-Content package-self-test.json -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.number_delete_and_reuse) { throw 'Packaged self-test reported failure' }
      - name: Zip and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "LightSnip-v$version-windows-x64.zip"
          Compress-Archive -Path "releases/v$version/LightSnip" -DestinationPath $name
          $digest = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $name" | Set-Content -Encoding utf8 SHA256SUMS.txt
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" --target "$env:GITHUB_SHA" --title "轻截 LightSnip v$version — 免费开源截图软件" --notes-file RELEASE_NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload "v$version" $name SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
